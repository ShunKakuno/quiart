version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: db-postgres
    restart: always
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: quizapp
      POSTGRES_PASSWORD: quizapp
      POSTGRES_DB: quizapp
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./api
    container_name: quiz_api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://quizapp:quizapp@postgres:5432/quizapp
    env_file:
      - ./api/.env
    depends_on:
      - postgres
    command: bun run src/api.ts

  app:
    build: ./app
    container_name: quiz_app
    ports:
      - "5173:5173"
    env_file:
      - ./app/.env
    command: npm run dev -- --host

volumes:
  postgres_data:
